<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>生日快乐</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
overflow:hidden;

background:
linear-gradient(
180deg,
#8ed6ff,
#ffd6e7
);

display:flex;
justify-content:center;
align-items:center;

font-family:"Comic Sans MS","Microsoft YaHei";

}


/* 艺术标题 */

.title{

position:absolute;

top:50px;

width:100%;

text-align:center;

font-size:55px;

font-weight:bold;

font-family:"STKaiti","KaiTi";

color:#fff;

letter-spacing:5px;

text-shadow:

0 5px 0 #ff8fab,
0 0 20px #fff;

animation:titleFloat 3s infinite;

z-index:10;

}


@keyframes titleFloat{

50%{
transform:translateY(-10px);
}

}



/* 蛋糕 */

.cake{

position:relative;

width:280px;

height:280px;

cursor:pointer;

}



/* 盘子 */

.plate{

position:absolute;

bottom:20px;

left:10px;

width:260px;

height:40px;

background:white;

border-radius:50%;

box-shadow:
0 10px 20px #999;

}



/* 蛋糕层 */


.layer{

position:absolute;

left:35px;

border-radius:25px;

}


.bottom{

bottom:50px;

width:210px;

height:80px;

background:#ffb6c9;

box-shadow:
inset 0 -15px #ff8fab;

}



.middle{

bottom:120px;

left:55px;

width:170px;

height:60px;

background:#ffe0ec;

}



.top{

bottom:170px;

left:75px;

width:130px;

height:50px;

background:#fff;

}



/* 奶油 */

.cream{

position:absolute;

width:25px;

height:25px;

background:white;

border-radius:50%;

}



.c1{
left:80px;
bottom:210px;
}

.c2{
left:130px;
bottom:215px;
}

.c3{
left:180px;
bottom:210px;
}



/* 草莓 */

.strawberry{

position:absolute;

width:25px;

height:30px;

background:#ff476f;

border-radius:50%;

top:-15px;

}


.s1{
left:90px;
}

.s2{
left:150px;
}



/* 蜡烛 */

.candle{

position:absolute;

width:14px;

height:45px;

background:#fff;

top:80px;

left:133px;

border-radius:5px;

}


.fire{

position:absolute;

top:-25px;

left:-5px;

width:25px;

height:35px;

background:#ffd166;

border-radius:50%;

animation:fire .4s infinite alternate;

}


@keyframes fire{

to{

transform:scale(1.3);

}

}



/* 烟花 */

.firework{

position:absolute;

width:5px;

height:5px;

background:#fff;

border-radius:50%;

animation:boom 1s infinite;

}


@keyframes boom{


0%{

transform:scale(1);

opacity:1;

}


100%{

transform:

scale(25);

opacity:0;

}

}



/* 祝福 */


.message{

position:absolute;

bottom:60px;

font-size:25px;

color:white;

text-align:center;

font-weight:bold;

text-shadow:

0 0 10px #ff69b4;

z-index:20;

}






</style>

</head>


<body>



<div class="title">

🎂 Happy Birthday 🎂

</div>



<div class="cake" onclick="openGift()">



<div class="plate"></div>


<div class="layer bottom"></div>

<div class="layer middle"></div>

<div class="layer top"></div>



<div class="cream c1"></div>
<div class="cream c2"></div>
<div class="cream c3"></div>



<div class="strawberry s1"></div>
<div class="strawberry s2"></div>



<div class="candle">

<div class="fire"></div>

</div>



</div>



<div class="message" id="msg">

请点一下蛋糕 ✨

</div>



<script>


// 自动烟花

function fireworks(){


let f=document.createElement("div");

f.className="firework";

f.style.left=Math.random()*100+"%";

f.style.top=Math.random()*60+"%";


f.style.background=

[
"#ff4d6d",
"#ffd166",
"#4cc9f0",
"#80ed99"
]
[
Math.floor(Math.random()*4)
];


document.body.appendChild(f);


setTimeout(()=>{

f.remove();

},1000);


}


setInterval(fireworks,500);





// 点击互动


function openGift(){


document.querySelector(".fire")
.style.display="none";


document.getElementById("msg")
.innerHTML=

`
💖 生日快乐 💖<br>
小朋友<br>
希望好运和快乐一直陪伴你 ✨
`;




}


}


</script>



</body>
</html>
