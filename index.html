<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>生日快乐 🎂</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#24103f,#9b315f,#ffb6c1);
font-family:"Microsoft YaHei";
color:white;
}

.container{
text-align:center;
}

h1{
font-size:45px;
text-shadow:0 0 20px #ffd166;
animation:up 2s infinite;
}

@keyframes up{
50%{transform:translateY(-10px)}
}


/* 蛋糕 */
.cake{
position:relative;
width:260px;
height:230px;
margin:40px auto;
cursor:pointer;
}

.layer{
position:absolute;
border-radius:20px;
left:20px;
background:#ffc8dd;
box-shadow:0 8px 0 #d77b91;
}

.bottom{
width:220px;
height:70px;
bottom:20px;
}

.middle{
width:190px;
height:55px;
left:35px;
bottom:85px;
}

.top{
width:150px;
height:45px;
left:55px;
bottom:135px;
}


/* 蜡烛 */
.candle{
position:absolute;
bottom:180px;
left:125px;
width:12px;
height:45px;
background:white;
z-index:3;
}

.fire{
position:absolute;
width:28px;
height:35px;
top:-25px;
left:-8px;
background:#ffd166;
border-radius:50%;
animation:fire .5s infinite alternate;
}

@keyframes fire{
to{
transform:scale(1.3);
}
}


.text{
font-size:22px;
line-height:2;
}


button{
margin-top:20px;
padding:12px 30px;
border:0;
border-radius:30px;
background:#ffd166;
font-size:18px;
color:#7b2450;
}


/* 爱心 */
.heart{
position:absolute;
font-size:25px;
animation:fall 5s linear infinite;
}

@keyframes fall{
from{
top:-10%;
}
to{
top:110%;
transform:rotate(360deg);
}
}


/* 星星 */
.star{
position:absolute;
width:5px;
height:5px;
background:white;
border-radius:50%;
animation:blink 2s infinite;
}

@keyframes blink{
50%{opacity:.2}
}

</style>
</head>


<body>


<div class="container">

<h1>🎂 Happy Birthday 🎂</h1>


<div class="cake" onclick="surprise()">

<div class="candle">
<div class="fire"></div>
</div>

<div class="layer top"></div>
<div class="layer middle"></div>
<div class="layer bottom"></div>

</div>


<div class="text" id="message">
点击蛋糕开启惊喜 ✨
</div>


<button onclick="surprise()">
打开祝福 💖
</button>


</div>



<script>

// 星空
for(let i=0;i<50;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
document.body.appendChild(s);
}



// 点击效果
function surprise(){

document.querySelector(".fire").style.display="none";


document.getElementById("message").innerHTML=
`
💖 生日快乐 💖<br>
愿你眼里有光<br>
心中有爱<br>
每天都有新的惊喜 ✨
`;


// 爱心雨
for(let i=0;i<40;i++){

let h=document.createElement("div");

h.className="heart";
h.innerHTML="❤️";

h.style.left=Math.random()*100+"%";
h.style.animationDelay=Math.random()*3+"s";

document.body.appendChild(h);

}

}

</script>


</body>
</html>
