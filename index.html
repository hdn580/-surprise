<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>生日惊喜 🎂</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;


background:

linear-gradient(

180deg,

#8ed6ff,

#ffd6e7

);


font-family:"Microsoft YaHei";

}



/******** 标题 ********/


.title{

position:absolute;

top:45px;

width:100%;

text-align:center;


font-family:"STKaiti","KaiTi";

font-size:50px;

font-weight:bold;


color:white;


text-shadow:

0 5px #ff7aa2,

0 0 25px white;


animation:titleMove 3s infinite;


z-index:10;

}



@keyframes titleMove{

50%{

transform:translateY(-10px);

}

}



/******** 输入框 ********/


#inputBox{

position:absolute;

top:45%;

display:flex;

flex-direction:column;

gap:20px;

align-items:center;

z-index:50;

}


input{

width:230px;

padding:15px;

border:none;

border-radius:30px;

font-size:18px;

text-align:center;

outline:none;

}



button{

padding:15px 35px;

border:none;

border-radius:30px;

background:#ff6b9a;

color:white;

font-size:20px;

box-shadow:

0 5px 15px #cc6688;

cursor:pointer;

}



/******** 蛋糕 ********/


.cake{

position:relative;

width:300px;

height:300px;

cursor:pointer;

}



/******** 盘子 ********/


.plate{

position:absolute;

bottom:20px;

left:20px;

width:260px;

height:45px;

background:white;

border-radius:50%;

box-shadow:

0 8px 15px #999;

}




/******** 蛋糕层 ********/


.layer{

position:absolute;

border-radius:25px;

left:40px;

}



.bottom{

bottom:55px;

width:220px;

height:80px;

background:#ff9fc0;


box-shadow:

inset 0 -15px #ff6f9d;


}



.middle{

bottom:125px;

left:60px;

width:180px;

height:65px;

background:#ffd1e2;

}




.top{

bottom:180px;

left:80px;

width:140px;

height:55px;

background:white;

}



/******** 奶油 ********/


.cream{

position:absolute;

width:30px;

height:30px;

background:white;

border-radius:50%;

}


.c1{

bottom:220px;

left:90px;

}


.c2{

bottom:220px;

left:140px;

}


.c3{

bottom:220px;

left:190px;

}




/******** 草莓 ********/


.strawberry{

position:absolute;

width:30px;

height:35px;

background:#ff365d;

border-radius:50% 50% 40% 40%;

top:-15px;

}



.s1{

left:95px;

}


.s2{

left:170px;

}





/******** 蜡烛 ********/


.candle{

position:absolute;

top:75px;

left:143px;

width:15px;

height:55px;

background:white;

border-radius:5px;

}



.fire{

position:absolute;

top:-30px;

left:-7px;

width:30px;

height:40px;

background:#ffd166;

border-radius:50%;


animation:fire .4s infinite alternate;

}



@keyframes fire{

to{

transform:scale(1.3);

}

}




/******** 祝福 ********/


.message{

position:absolute;

bottom:50px;

width:100%;

text-align:center;


font-size:24px;

font-weight:bold;

color:white;


text-shadow:

0 0 15px #ff4f91;


z-index:20;

}



/******** 烟花 ********/


.firework{

position:absolute;

width:8px;

height:8px;

border-radius:50%;

animation:boom 1s forwards;

}



@keyframes boom{


0%{

transform:scale(1);

opacity:1;

}


100%{

transform:scale(30);

opacity:0;

}

}




/******** 爱心 ********/


.heart{

position:absolute;

font-size:30px;

animation:heartMove 4s linear forwards;

}


@keyframes heartMove{


0%{

bottom:0;

opacity:1;

}


100%{

bottom:100%;

opacity:0;

}

}


</style>


</head>



<body>



<div class="title" id="title">

🎂 Happy Birthday 🎂

</div>



<div id="inputBox">


<input

id="name"

placeholder="请输入你的名字">


<button onclick="startBirthday()">

开启惊喜 🎁

</button>


</div>




<div class="cake" onclick="startBirthday()">



<div class="plate"></div>


<div class="layer bottom"></div>


<div class="layer middle"></div>


<div class="layer top"></div>


<div class="cream c1"></div>

<div class="cream c2"></div>

<div class="cream c3"></div>



<div class="strawberry s1"></div>

<div class="strawberry s2"></div>



<div class="candle">


<div class="fire"></div>


</div>



</div>



<div class="message" id="msg">

请输入你的名字 ✨

</div>




<script>



let opened=false;



function startBirthday(){



if(opened)return;


opened=true;



let name=document.getElementById("name").value;


if(name==""){

name="杨蓉";

}




//隐藏输入框

document.getElementById("inputBox")
.style.display="none";




//标题

document.getElementById("title")
.innerHTML=

"🎂 "+name+" 生日快乐 🎂";




//熄灭蜡烛

document.querySelector(".fire")
.style.display="none";




//祝福

document.getElementById("msg")
.innerHTML=

`
💖 ${小朋友} 💖<br>
愿你每天开心<br>
愿所有美好如期而至 ✨
`;




//大量烟花


for(let i=0;i<100;i++){

setTimeout(()=>{

createFirework();

},i*30);


}



//爱心

for(let i=0;i<60;i++){


let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";


h.style.left=

Math.random()*100+"%";


h.style.animationDelay=

Math.random()*3+"s";


document.body.appendChild(h);


}


}





function createFirework(){


let f=document.createElement("div");


f.className="firework";


f.style.left=

Math.random()*100+"%";


f.style.top=

Math.random()*70+"%";



let colors=[

"#ff4d6d",

"#ffd166",

"#4cc9f0",

"#80ed99",

"#ffffff"

];



f.style.background=

colors[Math.floor(Math.random()*colors.length)];



document.body.appendChild(f);



setTimeout(()=>{

f.remove();

},1000);


}



setInterval(createFirework,1200);



</script>



</body>

</html>
