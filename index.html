<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Birthday Surprise</title>

<style>
body{
margin:0;
overflow:hidden;
background:#02020b;
font-family:sans-serif;
}

#text{
position:absolute;
top:10%;
width:100%;
text-align:center;
color:white;
font-size:38px;
font-weight:bold;
text-shadow:0 0 20px #ffcc66;
z-index:5;
}

#tip{
position:absolute;
bottom:10%;
width:100%;
text-align:center;
color:white;
font-size:20px;
z-index:5;
}

canvas{
display:block;
}

</style>

</head>


<body>


<div id="text">
🎂 Happy Birthday 🎂
</div>

<div id="tip">
点击蛋糕开启惊喜 ✨
</div>



<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>


<script>


// 场景

let scene=new THREE.Scene();

scene.background=new THREE.Color(0x02020b);



let camera=new THREE.PerspectiveCamera(
45,
innerWidth/innerHeight,
0.1,
1000
);

camera.position.z=8;



let renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

document.body.appendChild(renderer.domElement);




// 灯光

let light=new THREE.PointLight(
0xffddaa,
2,
100
);

light.position.set(0,4,3);

scene.add(light);



scene.add(
new THREE.AmbientLight(
0xffffff,
0.5
)
);




// 蛋糕材质

function cakeLayer(
radius,
height,
y,
color
){

let geo=new THREE.CylinderGeometry(
radius,
radius,
height,
64
);


let mat=new THREE.MeshStandardMaterial({
color:color,
roughness:.3
});


let mesh=new THREE.Mesh(
geo,
mat
);

mesh.position.y=y;

scene.add(mesh);

return mesh;

}



// 三层蛋糕

let cake=[];


cake.push(
cakeLayer(
2,
0.6,
-1,
0xff77aa
)
);


cake.push(
cakeLayer(
1.6,
0.5,
-0.35,
0xffc1dd
)
);


cake.push(
cakeLayer(
1.2,
0.45,
0.25,
0xffffff
)
);




// 蜡烛

let candleGeo=
new THREE.CylinderGeometry(
0.08,
0.08,
1,
32
);


let candleMat=
new THREE.MeshStandardMaterial({
color:0xffffff
});


let candle=
new THREE.Mesh(
candleGeo,
candleMat
);

candle.position.y=1;

scene.add(candle);



// 火焰

let flameGeo=
new THREE.SphereGeometry(
0.22,
32,
32
);


let flameMat=
new THREE.MeshBasicMaterial({
color:0xffaa00
});


let flame=
new THREE.Mesh(
flameGeo,
flameMat
);


flame.position.y=1.65;

scene.add(flame);





// 星星粒子

let starsGeo=
new THREE.BufferGeometry();


let points=[];


for(let i=0;i<800;i++){

points.push(
(Math.random()-0.5)*20,
(Math.random()-0.5)*15,
(Math.random()-0.5)*10
);

}


starsGeo.setAttribute(
'position',
new THREE.Float32BufferAttribute(
points,
3
)
);



let stars=
new THREE.Points(
starsGeo,
new THREE.PointsMaterial({
color:0xffffff,
size:0.03
})
);


scene.add(stars);




// 动画


function animate(){

requestAnimationFrame(
animate
);


// 蛋糕慢慢旋转

cake.forEach(
c=>c.rotation.y+=0.002
);


// 火焰跳动

flame.scale.y=
1+
Math.sin(Date.now()*0.02)*0.3;


stars.rotation.y+=0.0005;



renderer.render(
scene,
camera
);

}


animate();




// 点击祝福


document.body.onclick=function(){

document.getElementById(
"text"
).innerHTML=
`
✨ 生日快乐 ✨<br>
小朋友<br>
生活顺利 一切安好 ❤️
`;

};



// 手机适配

window.onresize=function(){

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

}


</script>


</body>
</html>
