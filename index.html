<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Birthday Card</title>


<!-- 艺术字体 -->

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pacifico&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

overflow:hidden;

background:

linear-gradient(

135deg,

#ffd6e8,

#fff1c9

);


display:flex;

justify-content:center;

align-items:center;

font-family:"Microsoft YaHei";

}



/* 背景星光 */

.star{

position:absolute;

width:5px;

height:5px;

background:white;

border-radius:50%;

animation:twinkle 2s infinite;

}


@keyframes twinkle{

50%{

opacity:.2;

}

}



/* 贺卡 */

.card{


width:360px;

height:620px;


background:

rgba(255,255,255,.92);


border-radius:35px;


box-shadow:

0 20px 50px rgba(0,0,0,.2);


position:relative;


text-align:center;


padding-top:30px;


overflow:hidden;


}





/* 主标题 */

.title{


font-family:"Great Vibes";

font-size:65px;

color:#ff7096;


line-height:1;


}



.sub{


font-family:"Pacifico";

font-size:28px;

color:#f7b267;

margin-top:5px;

}




.small{

font-family:"ZCOOL KuaiLe";

color:#ff9fbc;

font-size:18px;

margin-top:10px;

}



/* 蛋糕区域 */


.cake{


position:absolute;

top:230px;

left:50%;

transform:translateX(-50%);


width:240px;

height:220px;

cursor:pointer;


}




/* 蛋糕盘 */


.plate{

position:absolute;

bottom:10px;

left:0;

width:240px;

height:35px;

background:white;

border-radius:50%;


box-shadow:

0 5px 10px #ccc;


}



/* 蛋糕层 */


.layer{

position:absolute;

border-radius:25px;

left:20px;

}


.bottom{


bottom:40px;


width:200px;

height:70px;


background:#ff9ec4;


}



.middle{


bottom:100px;

left:35px;


width:170px;

height:55px;


background:#ffd1e5;


}



.top{


bottom:145px;


left:55px;


width:130px;


height:45px;


background:white;


}



/* 奶油 */


.cream{

position:absolute;

width:28px;

height:28px;

background:white;

border-radius:50%;

}


.c1{

left:65px;

bottom:165px;

}


.c2{

left:105px;

bottom:170px;

}


.c3{

left:145px;

bottom:165px;

}





/* 草莓 */


.berry{

position:absolute;

width:30px;

height:35px;

background:#ff477e;

border-radius:50%;

top:55px;


}


.b1{

left:85px;

}


.b2{

left:130px;

}




/* 蜡烛 */


.candle{

position:absolute;


left:115px;


top:35px;


width:12px;


height:45px;


background:#fff;


}



.fire{


position:absolute;

width:25px;

height:35px;

background:#ffd166;

border-radius:50%;


top:-25px;

left:-7px;


animation:fire .5s infinite alternate;


}


@keyframes fire{

to{

transform:scale(1.3);

}

}





/* 祝福区域 */


.words{


position:absolute;


bottom:90px;


width:100%;


padding:0 30px;


font-family:"ZCOOL KuaiLe";


font-size:22px;


color:#ff7096;


line-height:1.8;


}





/* 底部提示 */


.tip{


position:absolute;

bottom:35px;


width:100%;


font-size:16px;


color:#aaa;


}




/* 烟花 */


.firework{


position:absolute;

width:8px;

height:8px;

border-radius:50%;


animation:boom 1s forwards;


}


@keyframes boom{


from{

transform:scale(1);

opacity:1;

}

to{

transform:scale(25);

opacity:0;

}


}




/* 爱心 */


.heart{

position:absolute;

font-size:25px;

animation:heart 3s linear forwards;

}


@keyframes heart{


from{

bottom:20%;

opacity:1;

}


to{

bottom:100%;

opacity:0;

}


}



</style>


</head>



<body>




<div class="card">



<div class="title">

Happy

</div>


<div class="sub">

Birthday

</div>


<div class="small">

✨ Make A Wish ✨

</div>




<div class="cake" onclick="surprise()">



<div class="plate"></div>


<div class="layer bottom"></div>

<div class="layer middle"></div>

<div class="layer top"></div>



<div class="cream c1"></div>

<div class="cream c2"></div>

<div class="cream c3"></div>


<div class="berry b1"></div>

<div class="berry b2"></div>



<div class="candle">

<div class="fire"></div>


</div>



</div>




<div class="words" id="words">


愿你：

✨ 心中有光<br>

✨ 所遇皆甜<br>

✨ 岁岁欢喜<br>

✨ 平安顺遂


</div>




<div class="tip">

点击蛋糕开启惊喜 🎂

</div>



</div>




<script>



// 星星

for(let i=0;i<60;i++){

let s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"%";

s.style.top=Math.random()*100+"%";


document.body.appendChild(s);


}





// 烟花


function firework(){


let f=document.createElement("div");

f.className="firework";


f.style.left=Math.random()*100+"%";

f.style.top=Math.random()*70+"%";


f.style.background=

[
"#ff7096",
"#ffd166",
"#4cc9f0",
"#80ed99"

][Math.floor(Math.random()*4)];


document.body.appendChild(f);


setTimeout(()=>f.remove(),1000);


}



setInterval(firework,800);





// 点击蛋糕


function surprise(){



document.querySelector(".fire")
.style.display="none";



document.getElementById("words")
.innerHTML=

`


💖 生日快乐 💖<br>

小朋友<br>

平安喜乐<br>

生活顺利 ✨


`;




for(let i=0;i<50;i++){


let h=document.createElement("div");


h.className="heart";


h.innerHTML="❤️";


h.style.left=Math.random()*100+"%";


document.body.appendChild(h);


}


}



</script>



</body>

</html>
